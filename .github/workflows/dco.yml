name: DCO

# Every commit in a pull request must carry a Signed-off-by line matching its
# author (Developer Certificate of Origin; see CONTRIBUTING.md).

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add a sign-off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed off."
